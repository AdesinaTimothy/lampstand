# One-click demo on Render: Dashboard > New > Blueprint, then pick this repository.
# Creates the app (Docker), a PostgreSQL database and a disk for uploaded files.
# The first boot seeds the Grace Harbor demo church because SEED_DEMO_IF_EMPTY is true.
# Set it to false (and change APP_ORGANIZATION_SLUG) before using this for a real church.
services:
  - type: web
    name: lampstand
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: uploads
      mountPath: /var/lampstand/storage
      sizeGB: 5
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lampstand-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: APP_ORGANIZATION_SLUG
        value: grace-harbor
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: /var/lampstand/storage
      - key: MAIL_DRIVER
        value: log
      - key: SEED_DEMO_IF_EMPTY
        value: "true"

databases:
  - name: lampstand-db
    plan: basic-256mb
    postgresMajorVersion: "16"
