# One-click demo on Render (free plans): Dashboard > New > Blueprint, then pick this repository.
# Creates the app (Docker) and a PostgreSQL database. The free plan has no persistent disk,
# so uploaded files live in /app/storage and are lost on each restart or deploy.
# The first boot seeds the Grace Harbor demo church because SEED_DEMO_IF_EMPTY is true.
# Set it to false (and change APP_ORGANIZATION_SLUG) before using this for a real church.
services:
  - type: web
    name: lampstand
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lampstand-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: APP_ORGANIZATION_SLUG
        value: grace-harbor
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: /app/storage
      - key: MAIL_DRIVER
        value: log
      - key: SEED_DEMO_IF_EMPTY
        value: "true"

databases:
  - name: lampstand-db
    plan: free
    postgresMajorVersion: "16"
